packages:
  - path: "klats/internal/testfmt"
    output_path: "web/shared/src/generated/testfmt.ts"
  - path: "klats/internal/wire"
    output_path: "web/shared/src/generated/wire.ts"
    frontmatter: "import type { Answer, Image, Point, Problem, Question, Test } from './testfmt';"
    type_mappings:
      testfmt.Test: "Test"
      testfmt.Problem: "Problem"
      testfmt.Question: "Question"
      testfmt.Answer: "Answer"
      testfmt.Point: "Point"
      testfmt.Image: "Image"
