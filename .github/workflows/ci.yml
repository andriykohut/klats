name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.4
      - uses: pnpm/action-setup@v6
        with:
          version: 12.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.0
      - name: Install desktop build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      - run: make gen web check
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.4
      - uses: pnpm/action-setup@v6
        with:
          version: 12.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.0
      - run: make gen
      - run: pnpm install && pnpm --filter @klats/e2e exec playwright install --with-deps chromium firefox
        working-directory: web
      # The runner has no sound device, and Firefox on Linux reports a media
      # error when it can't open an audio output, so the audio specs need a
      # (silent) PulseAudio sink.
      - name: Start a silent sound device
        run: |
          sudo apt-get install -y pulseaudio
          pulseaudio --daemonize --exit-idle-time=-1
          pactl load-module module-null-sink
      - run: make e2e
