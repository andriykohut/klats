name: Pages

on:
  push:
    branches: [main]
    paths:
      - web/site/**
      - web/shared/src/fonts/**
      - web/shared/src/fonts.css
      - web/shared/src/tokens.css
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits rather than cancelling one
# that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # GitHub Pages needs a paid plan for a private repository. Skipping here
    # skips deploy too, which needs this job.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.0
      - run: pnpm install && pnpm --filter @klats/site build
        working-directory: web
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
